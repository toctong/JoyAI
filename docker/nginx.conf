# JoyAI edge proxy (HTTP). Feiniu / CDN terminates TLS and forwards here (:3000).
# /api and /socket.io go straight to Nest so WebSocket Upgrade is not lost in Next rewrites.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /dev/stdout combined;
  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;
  client_max_body_size 100m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Prefer outer proxy (Feiniu / tunnel) headers when present.
  # Do NOT overwrite a good X-Forwarded-Host with an internal Host.
  map $http_x_forwarded_host $joyai_fwd_host {
    ''           $host;
    ~^([^,\s]+)  $1;
    default      $host;
  }

  map $http_x_forwarded_proto $joyai_fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
  }

  upstream joyai_web {
    server 127.0.0.1:3002;
    keepalive 32;
  }

  upstream joyai_api {
    server 127.0.0.1:3001;
    keepalive 32;
  }

  server {
    listen 3000;
    server_name _;

    # Socket.IO (polling + websocket). Must not go through Next.
    location /socket.io/ {
      proxy_pass http://joyai_api;
      proxy_http_version 1.1;
      proxy_set_header Host $joyai_fwd_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $joyai_fwd_host;
      proxy_set_header X-Forwarded-Proto $joyai_fwd_proto;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /api/ {
      proxy_pass http://joyai_api;
      proxy_http_version 1.1;
      proxy_set_header Host $joyai_fwd_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $joyai_fwd_host;
      proxy_set_header X-Forwarded-Proto $joyai_fwd_proto;
      proxy_set_header Connection "";
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
    }

    location / {
      proxy_pass http://joyai_web;
      proxy_http_version 1.1;
      proxy_set_header Host $joyai_fwd_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $joyai_fwd_host;
      proxy_set_header X-Forwarded-Proto $joyai_fwd_proto;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # Next may still emit absolute Location to its bind address — rewrite.
      proxy_redirect http://127.0.0.1:3002/ /;
      proxy_redirect http://localhost:3002/ /;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
    }
  }
}
