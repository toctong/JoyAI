services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - joyai_redis:/data

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: joyai
      MYSQL_DATABASE: joyai
      MYSQL_USER: joyai
      MYSQL_PASSWORD: joyai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=67108864
    volumes:
      - joyai_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pjoyai"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  joyai_redis:
  joyai_mysql:
