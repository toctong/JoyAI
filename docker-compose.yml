services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: joyai
      POSTGRES_PASSWORD: joyai
      POSTGRES_DB: joyai
    ports:
      - "5432:5432"
    volumes:
      - joyai_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - joyai_redis:/data

volumes:
  joyai_pg:
  joyai_redis:
