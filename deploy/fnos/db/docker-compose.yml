# 飞牛 Docker 面板：把本目录建成一个 Compose 项目，先启动这个，再启动 app。
# 密码从本目录的 .env 读取（和 docker-compose.yml 放一起）。没有这个文件时，密码用 joyai。
# 数据会写到本目录 data/mysql、data/redis。

name: joyai-db

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-joyai}
      MYSQL_DATABASE: joyai
      MYSQL_USER: joyai
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-joyai}
      # UTC so CURRENT_TIMESTAMP / DATETIME match TypeORM timezone: Z (avoid +8h UI skew).
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=67108864
      - --default-time-zone=+00:00
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-joyai}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - joyai

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-16379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - joyai

networks:
  joyai:
    name: joyai-data
